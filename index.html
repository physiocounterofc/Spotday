<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#121212">
    <meta name="description" content="Seu resumo musical diário do Spotify">

    <title>Spotday</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>

<body>

    <main class="app">

        <section id="login-screen" class="screen">

            <div class="logo">
                <span>spot</span><strong>day</strong>
            </div>

            <p class="subtitle">
                Seu dia em músicas.
            </p>

            <button id="login-button" class="spotify-button">
                Conectar ao Spotify
            </button>

        </section>


        <section id="dashboard" class="screen hidden">

            <header class="header">
                <div>
                    <p class="eyebrow">RESUMO DE HOJE</p>
                    <h1>Seu Spotday</h1>
                </div>

                <button id="logout-button" class="logout">
                    Sair
                </button>
            </header>


            <section class="stats">

                <div class="stat-card">
                    <span class="stat-icon">🎵</span>
                    <span id="tracks-count" class="stat-number">0</span>
                    <span class="stat-label">músicas</span>
                </div>

                <div class="stat-card">
                    <span class="stat-icon">🎤</span>
                    <span id="artists-count" class="stat-number">0</span>
                    <span class="stat-label">artistas</span>
                </div>

                <div class="stat-card">
                    <span class="stat-icon">⏱️</span>
                    <span id="minutes-count" class="stat-number">0</span>
                    <span class="stat-label">minutos</span>
                </div>

            </section>


            <section class="favorite-card">

                <p class="eyebrow">MAIS OUVIDA</p>

                <div class="favorite-content">

                    <img
                        id="top-track-image"
                        src=""
                        alt="Capa do álbum"
                    >

                    <div>
                        <h2 id="top-track-name">
                            Nenhuma música
                        </h2>

                        <p id="top-track-artist">
                            —
                        </p>

                        <span id="top-track-count">
                            0 reproduções
                        </span>
                    </div>

                </div>

            </section>


            <section class="history-section">

                <div class="section-title">
                    <h2>Hoje</h2>
                    <span id="history-count">0</span>
                </div>

                <div id="history-list" class="history-list"></div>

            </section>

        </section>

    </main>

    <script src="auth.js"></script>
    <script src="spotify.js"></script>
    <script src="app.js"></script>

</body>
</html>
